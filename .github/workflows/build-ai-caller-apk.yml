name: Build AI Caller APK

on:
  push:
    branches: [ai-caller-apk]
    paths-ignore: ['release/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-caller-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-caller-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --project-name ai_caller --org com.stargrowthhub --platforms android .
          rm -f test/widget_test.dart

      - name: Patch Android manifest (internet, app name, links)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Star AI Caller"', s, count=1)
          if 'android.intent.action.VIEW' not in s:
              s = s.replace('</manifest>', '    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW"/>\n            <data android:scheme="https"/>\n        </intent>\n    </queries>\n</manifest>')
          p.write_text(s)
          print(s)
          PY

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: star-ai-caller-apk
          path: ai-caller-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Commit APK to this branch
        working-directory: .
        run: |
          mkdir -p release
          cp ai-caller-app/build/app/outputs/flutter-apk/app-release.apk release/star-ai-caller.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/star-ai-caller.apk
          git commit -m "Build APK ${GITHUB_SHA::7} [skip ci]" || echo "no change"
          git push
