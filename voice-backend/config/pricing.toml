# Sarvam pay-as-you-go rates in ₹, excluding GST.
# Source: https://docs.sarvam.ai/api/getting-started/pricing (checked 2026-10-28).
# Update these when your plan changes (Pro/Growth have lower STT/TTS rates).

[stt]
inr_per_minute = 0.49

[tts."bulbul:v4-flash"]
inr_per_1k_chars = 1.00

[tts."bulbul:v3"]
inr_per_1k_chars = 3.00

[llm."sarvam-105b-conversations"]
input_per_1m = 15.0
cached_input_per_1m = 5.0
output_per_1m = 60.0

[llm."sarvam-105b"]
input_per_1m = 15.0
cached_input_per_1m = 5.0
output_per_1m = 60.0

[llm."gemma4"]
input_per_1m = 35.0
cached_input_per_1m = 10.0
output_per_1m = 90.0

# On Sarvam /v2 (sarvam.ai/api-pricing, 2026-10-29). mimo-v2.6-flash is
# not available to this account (404), so it was removed.
[llm."glm5.3-flash"]
input_per_1m = 13.5
cached_input_per_1m = 2.5
output_per_1m = 45.0

# Phone line. Each call's own charge (per-minute rate x billed seconds) is
# read from Plivo's call record after hangup, so only fixed costs go here.
[telephony]
number_rental_inr_per_month = 200.0   # one 080 number; add more if you rent more
gst_percent = 18.0                    # applied on top of every rate in this file
# Plivo's call records report charges in US dollars (e.g. $0.00475/min to
# Indian mobiles), so they are converted at this rate. Check your Plivo
# invoice and the current rate; set plivo_currency = "INR" if billed in ₹.
plivo_currency = "USD"
usd_to_inr = 91.4   # matches Plivo console INR spend (₹0.434/min = $0.00475)
