[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
common = { path = "crates/common" }
telephony = { path = "crates/telephony" }
audio = { path = "crates/audio" }
providers = { path = "crates/providers" }
pipeline = { path = "crates/pipeline" }
kb = { path = "crates/kb" }

# Runtime, HTTP, WebSocket
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "limit"] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "derive",
    "migrate",
] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }

# Errors, observability
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# Network clients
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream", "multipart"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# ML
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Misc
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
dashmap = "6"
form_urlencoded = "1"
governor = "0.10"
hex = "0.4"
hmac = "0.12"
hound = "3.5"
mimalloc = { version = "0.1", default-features = false }
moka = { version = "0.12", features = ["sync"] }
pdf-extract = "0.9"
regex = "1"
sha2 = "0.10"
subtle = "2"
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }

# Tests
testcontainers = "0.24"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
